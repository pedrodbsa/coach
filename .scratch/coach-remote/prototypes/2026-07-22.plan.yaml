  validate:
    every_step_has_target: true

  actual: null

# ═══ STRENGTH ════════════════════════════════════════════════════════════════
strength:
  session:
    kind: upper_pull
    start: "12:45"
    location: G1
    rpe: "7-8"
    rotated_off: 2026-06-29
    constraints: [no_leg_loading]
    movements:
      - slot: vertical_pull
        exercise: Lat pulldown
        sets: 4
        reps: [10, 10, 10, 8]
        load: { value: 110, unit: kg }
        rest_s: 120
        garmin: { category: PULL_UP, exercise_name: LAT_PULLDOWN, status: verified }
        why: progression trigger met Jun 29 — take 110×10 across
        note: if set 1 flies, go 115 kg
      - slot: horizontal_row
        exercise: Chest-supported DB row
        sets: 4
        reps: { min: 10, max: 12 }
        load: { value: 22.5, unit: kg, per: hand }
        rest_s: 120
        garmin: { category: ROW, exercise_name: DUMBBELL_ROW, status: verified }
        why: rebuild to the 22.5 target — Jun 29 ran 20 kg, conservative
        note: incline bench, strict
      - slot: row_accessory
        exercise: Straight-arm cable pulldown
        sets: 3
        reps: { min: 12, max: 15 }
        load: { value: 20, unit: kg }
        rest_s: 90
        garmin: { category: PULL_UP, exercise_name: null, status: free_entry }
      - slot: rear_delt
        exercise: Face pull
        sets: 3
        reps: [15]
        load: { value: 35, unit: kg }
        rest_s: 90
      - slot: biceps
        exercise: Incline DB curl
        sets: 3
        reps: { min: 10, max: 12 }
        load: { value: 10, unit: kg }
        rest_s: 90
        note: top of the working range — drop to 8 kg if reps fade below 10
      - slot: core_anti_rotation
        exercise: Half-kneeling cable chop
        sets: 3
        reps: { value: 12, per: side }
        load: { value: 30, unit: kg }
        rest_s: 60
      - slot: carry
        exercise: Suitcase carry
        sets: 3
        distance_m: 35
        per: side
        load: { value: 24, unit: kg }
        rest_s: 60
    garmin: { push: true, workout_id: null }

  validate:
    every_movement_has_load: true
    gym_can_perform: G1
    no_movement_in: [legs]

  actual: null

